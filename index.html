<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="native">
  <meta property="og:url" content="https://native.beer">
  <meta property="og:description" content="about me!">
  <meta name="theme-color" content="#0069f2">

  <title>chudatron</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      background: #0d0d0d;
      color: #fff;
      padding: 30px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 3rem;
    }

    header p {
      color: #aaa;
      margin-top: 10px;
    }

    .controls {
      max-width: 600px;
      margin: 0 auto 30px auto;
    }

    .search {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid #222;
      background: #111;
      color: #fff;
      outline: none;
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background: #161616;
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: 0.2s ease;
      border: 2px solid #222;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
      width: auto;
    }

    .card:hover {
      transform: translateY(-4px);
      border: 2px solid #333;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .card h2 {
      font-size: 1.3rem;
    }

    .card p {
      color: #aaa;
      font-size: 0.95rem;
    }

    .tag {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 8px;
      background: #222;
      color: #ccc;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      color: #666;
      font-size: 0.85rem;
    }
    .native {
        transition: 0.3s ease;
    }

    .native:hover {
        color: #5d7f92;
    }

    .github-card {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px;
    width: fit-content;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
    font-family: system-ui, sans-serif;
    display:grid;
    }
    .github-card-holder {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px;
    width: fit-content;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
    font-family: system-ui, sans-serif;
    display:flex;
    }

    .github-card-holder-wrapper {
    display: flex;
    justify-content: center; /* horizontal center */
    margin-top: 40px;        /* optional spacing from header */
    }

    .github-card h2 {
    color: #c9d1d9;
    margin-bottom: 15px;
    font-size: 1.4rem;
    }

    .github-card img {
    display: block;
    image-rendering: pixelated;
    }

  </style>
</head>
<body>

<header>
  <h1 class="native">Native</h1>
  <p>random stuff im working on</p>
</header>

<div class="controls">
  <input type="text" id="search" class="search" placeholder="search projects...">
</div>

<div class="grid" id="projectGrid"></div>

<footer>
  hi
</footer>
<div class="github-card-holder-wrapper">
  <div class="github-card-holder">
      <div class="github-card">
        <h2>GitHub Activity</h2>
        <img src="https://ghchart.rshah.org/nativefrfr" alt="GitHub contributions" />
      </div>
      <div class="github-card" style="width:200px; height:200px; margin-left: 10px; align-items: center;">
        <h2 style="margin-top:-20px;">nativefrfr</h2>
        <img src="https://avatars.githubusercontent.com/u/116759787?v=4" alt="github pfp" style="width:150px; height:150px; margin-top:-15px;" />
      </div>
  </div>
</div>
<script>
  const projects = [
    {
      name: "Native G*mes",
      url: "https://native.beer/work",
      desc: "some game site ive been working on",
      color: "#0099ff",
      tag: "website"
    },
    {
      name: "my github!",
      url: "https://github.com/nativefrfr",
      desc: "where I put my projects",
      color: "#ffffff",
      tag: "github"
    },
  ];

  const grid = document.getElementById("projectGrid");
  const search = document.getElementById("search");

  function createCard(project) {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="card-top">
        <div class="dot" style="background:${project.color || '#00ffcc'}"></div>
        <h2>${project.name}</h2>
      </div>
      <p>${project.desc || 'click to open'}</p>
      ${project.tag ? `<span class="tag">${project.tag}</span>` : ""}
    `;

    card.onclick = () => window.open(project.url, "_blank");

    return card;
  }

  function render(list) {
    grid.innerHTML = "";
    list.forEach(p => grid.appendChild(createCard(p)));
  }

  search.addEventListener("input", () => {
    const q = search.value.toLowerCase();
    const filtered = projects.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.desc && p.desc.toLowerCase().includes(q)) ||
      (p.tag && p.tag.toLowerCase().includes(q))
    );
    render(filtered);
  });

  render(projects);
</script>

</body>
</html>
