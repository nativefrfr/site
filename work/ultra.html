    <script>
        var canvas = document.querySelector("#unity-canvas");
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            // Mobile device style: fill the whole browser client area with the game canvas:
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";
            document.body.style.textAlign = "left";
        } else {
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }
                    fetch(fileParts[index]).then((response) => response.arrayBuffer()).then((data) => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        Promise.all([
            mergeFiles(getParts("Build/ultrakill.data.unityweb", 1, 4)),
            mergeFiles(getParts("Build/ultrakill.wasm.unityweb", 1, 2))
        ]).then(([dataUrl, wasmurl]) => {
            document.querySelector("#unity-canvas").hidden = false;
            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: dataUrl,
                frameworkUrl: "Build/ultrakill.framework.js.unityweb",
                codeUrl: wasmurl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Hakita and Cake Logic",
                productName: "ULTRAKILL",
                productVersion: "1.4",
                // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
                // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
            }).then((e) => {
                document.querySelector("#loading-text").remove();
                canvas.focus();
                window.focus();
            });
        });

     <script>
let deadzone = 0.2;
let prevButtons = {};
let keyState = {};

function pressKey(key, code, down){
    if(keyState[code] === down) return;
    keyState[code] = down;

    window.dispatchEvent(new KeyboardEvent(down ? "keydown" : "keyup",{
        key:key,
        code:code,
        bubbles:true
    }));
}

function mouseButton(button, down){
    window.dispatchEvent(new MouseEvent(down ? "mousedown" : "mouseup",{
        button:button,
        bubbles:true
    }));
}

function mouseMove(dx,dy){
    window.dispatchEvent(new MouseEvent("mousemove",{
        clientX:window.innerWidth/2 + dx,
        clientY:window.innerHeight/2 + dy,
        bubbles:true
    }));
}

function scroll(amount){
    window.dispatchEvent(new WheelEvent("wheel",{deltaY:amount}));
}

function loop(){

    const gp = navigator.getGamepads()[0];
    if(!gp){
        requestAnimationFrame(loop);
        return;
    }

    /* LEFT STICK → WASD */

    let lx = gp.axes[0];
    let ly = gp.axes[1];

    if(Math.abs(lx) < deadzone) lx = 0;
    if(Math.abs(ly) < deadzone) ly = 0;

    pressKey("d","KeyD", lx > 0);
    pressKey("a","KeyA", lx < 0);

    pressKey("s","KeyS", ly > 0);
    pressKey("w","KeyW", ly < 0);


    /* RIGHT STICK → CAMERA */

    let rx = gp.axes[2];
    let ry = gp.axes[3];

    if(Math.abs(rx) > deadzone || Math.abs(ry) > deadzone){
        mouseMove(rx*50, ry*50);
    }


    /* BUTTON MAP */

    const map = {
        7:["mouse",0],        // RT
        6:["mouse",2],        // LT
        5:["scroll",-120],    // RB
        4:["scroll",120],     // LB
        0:["key"," ","Space"],        // A
        2:["key","f","KeyF"],         // X
        3:["key","e","KeyE"],         // Y
        11:["key","Shift","ShiftLeft"], // RS
        10:["key","Control","ControlLeft"] // LS
    };

    gp.buttons.forEach((btn,i)=>{
        if(!map[i]) return;

        let pressed = btn.pressed;
        let prev = prevButtons[i];

        if(pressed && !prev){

            let action = map[i];

            if(action[0] === "mouse")
                mouseButton(action[1],true);

            if(action[0] === "scroll")
                scroll(action[1]);

            if(action[0] === "key")
                pressKey(action[1],action[2],true);
        }

        if(!pressed && prev){

            let action = map[i];

            if(action[0] === "mouse")
                mouseButton(action[1],false);

            if(action[0] === "key")
                pressKey(action[1],action[2],false);
        }

        prevButtons[i] = pressed;
    });

    requestAnimationFrame(loop);
}

window.addEventListener("gamepadconnected",()=>{
    console.log("controller connected");
    loop();
});
</script>
