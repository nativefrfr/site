    <script>
        var canvas = document.querySelector("#unity-canvas");
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            // Mobile device style: fill the whole browser client area with the game canvas:
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";
            document.body.style.textAlign = "left";
        } else {
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }
                    fetch(fileParts[index]).then((response) => response.arrayBuffer()).then((data) => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }
        Promise.all([
            mergeFiles(getParts("Build/ultrakill.data.unityweb", 1, 4)),
            mergeFiles(getParts("Build/ultrakill.wasm.unityweb", 1, 2))
        ]).then(([dataUrl, wasmurl]) => {
            document.querySelector("#unity-canvas").hidden = false;
            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: dataUrl,
                frameworkUrl: "Build/ultrakill.framework.js.unityweb",
                codeUrl: wasmurl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Hakita and Cake Logic",

            }).then((e) => {
                document.querySelector("#loading-text").remove();
            });
        });

<script>
let prevButtons = {};

function sendKey(key, type){
    document.dispatchEvent(new KeyboardEvent(type,{
        key:key,
        code:key,
        bubbles:true
    }));
}

function mouseMove(dx,dy){
    const canvas = document.getElementById("unity-canvas");
    canvas.dispatchEvent(new MouseEvent("mousemove",{
        movementX:dx,
        movementY:dy,
        bubbles:true
    }));
}

function mouseClick(button,type){
    const canvas = document.getElementById("unity-canvas");
    canvas.dispatchEvent(new MouseEvent(type,{
        button:button,
        bubbles:true
    }));
}

function scroll(amount){
    window.dispatchEvent(new WheelEvent("wheel",{deltaY:amount}));
}

function gamepadLoop(){
    const gp = navigator.getGamepads()[0];
    if(!gp){
        requestAnimationFrame(gamepadLoop);
        return;
    }

    /* LEFT STICK → MOUSE */
    let mx = gp.axes[0];
    let my = gp.axes[1];

    if(Math.abs(mx) > 0.1 || Math.abs(my) > 0.1){
        mouseMove(mx*20,my*20);
    }

    /* RIGHT STICK → WASD */
    let rx = gp.axes[2];
    let ry = gp.axes[3];

    function axisKey(val,pos,neg,keyPos,keyNeg){
        if(val > pos) sendKey(keyPos,"keydown");
        else sendKey(keyPos,"keyup");

        if(val < neg) sendKey(keyNeg,"keydown");
        else sendKey(keyNeg,"keyup");
    }

    axisKey(rx,0.4,-0.4,"d","a");
    axisKey(ry,0.4,-0.4,"s","w");

    const map = {
        7:["mouse",0],   // RT left click
        6:["mouse",2],   // LT right click
        5:["scroll",-120], // RB scroll up
        4:["scroll",120],  // LB scroll down
        0:["key"," "],   // A space
        2:["key","f"],   // X / square
        3:["key","e"],   // Y / triangle
        11:["key","Shift"], // right stick press
        10:["key","Control"] // left stick press
    };

    gp.buttons.forEach((btn,i)=>{
        if(!map[i]) return;

        let pressed = btn.pressed;
        let prev = prevButtons[i];

        if(pressed && !prev){
            let action = map[i];

            if(action[0]=="mouse") mouseClick(action[1],"mousedown");
            if(action[0]=="scroll") scroll(action[1]);
            if(action[0]=="key") sendKey(action[1],"keydown");
        }

        if(!pressed && prev){
            let action = map[i];

            if(action[0]=="mouse") mouseClick(action[1],"mouseup");
            if(action[0]=="key") sendKey(action[1],"keyup");
        }

        prevButtons[i] = pressed;
    });

    requestAnimationFrame(gamepadLoop);
}

window.addEventListener("gamepadconnected",()=>{
    console.log("Controller connected");
    gamepadLoop();
});
</script>
