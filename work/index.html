<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

/* THEMES */

body{
margin:0;
font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto;
transition:0.25s;
}

/* DARK MODE */

body.dark{
background:#0f1115;
color:#e6e6e6;
}

body.dark header{
background:#171a21;
border-bottom:1px solid #2b2f36;
}

body.dark .game{
background:#1a1d24;
}

body.dark .game a{
color:white;
}

/* LIGHT MODE */

body.light{
background:#f4f6f8;
color:#222;
}

body.light header{
background:white;
border-bottom:1px solid #ddd;
}

body.light .game{
background:white;
}

body.light .game a{
color:#222;
}


/* HEADER */

header{
padding:30px;
text-align:center;
}

/* THEME BUTTON */

.themeToggle{
position:fixed;
top:15px;
left:15px;
padding:8px 14px;
border:none;
border-radius:6px;
background:#3a7afe;
color:white;
cursor:pointer;
z-index:10;
}

/* SEARCH */

.searchBox{
text-align:center;
margin:20px;
}

.searchBox input{
padding:12px 16px;
width:320px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

/* COUNT */

.count{
text-align:center;
margin-bottom:10px;
opacity:0.8;
}

/* GRID */

.games{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:20px;
padding:20px;
}

/* CARD */

.game{
border-radius:10px;
overflow:hidden;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
transition:0.15s;
}

.game:hover{
transform:translateY(-4px);
}

.game img{
width:100%;
height:120px;
object-fit:cover;
}

.game a{
display:block;
padding:10px;
text-decoration:none;
font-weight:600;
}

/* DISCLAIMER */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

.disclaimer{
background:rgb(133, 124, 124);
padding:30px;
border-radius:10px;
max-width:550px;
text-align:center;
}

.disclaimer button{
margin-top:15px;
padding:10px 20px;
border:none;
background:#3a7afe;
color:white;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.disclaimer button:disabled{
background:#aaa;
}

/* BOTTOM BUTTON */

.classroomBtn{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#b15151;
color:white;
text-align:center;
padding:14px;
font-weight:bold;
cursor:pointer;
z-index:50;
}

.classroomBtn:hover{
    
background:#7a0303;
}

</style>
</head>

<body class="dark">

<button class="themeToggle" id="themeBtn">☀ Light Mode</button>

<div class="overlay" id="overlay">

<div class="disclaimer">

<h2 style="color: #680000;">Disclaimer</h2>

<p style="color: #000000;">I am not responsible for anything that happens when you play these games.</p>
<p style="color: #000000;">If you play these in a school enviroment, you may risk suspension.</p>
<p style="color: #000000;">I do not own these games. All rights belong to their owners.</p>

<label>
<input type="checkbox" id="agree">
I understand and accept this disclaimer
</label>

<br>

<button id="enter" disabled>Enter Site</button>

</div>
</div>


<header>
<h1>Native Games</h1>
</header>

<div class="searchBox">
<input id="search" placeholder="Search games...">
</div>

<div class="count" id="count"></div>

<div class="games" id="games"></div>


<div class="classroomBtn" onclick="window.location='https://classroom.google.com/'">
leave site quickly
</div>



<script>

/* GAME LIST */

const games=[

["fnaf","fivenights"],
["bitlife","bit"],
["ultrakill","ultra"],
["granny","gran"],
["crazycattle","crazy"],
["doom","doom"],
["happywheels","happywheels"],
["hollowknight","hk"],
["omori","omori"],
["peggle","peggle"],
["pvz","pvz"],
["pvz2","pvz2"],
["raft","raft"],
["repo","repo"],
["slimerancher","slime"],
["bindingofisaac","tboi"],
["terraria","ter"],
["thatsnotmyneighbor","tnmn"],
["1v1lol","1v1lol"],
["8ballbilliards","8ballbillards"],
["angrybirds","angrybirds"],
["attackhole","attackhole"],
["backrooms","backrooms"],
["baldi","baldi"],
["basketball","basketball"],
["basketrandom","basketrandom"],
["blockblast","blockblast"],
["bottlejump","bottlejump"],
["bowmasters","bowmasters"],
["boxingrandom","boxingrandom"],
["clusterrush","clusterrush"],
["colourmatch","colourmatch"],
["crossyroad","crossyroad"],
["customnight","customnight"],
["cuttherope","cuttherope"],
["digdeep","digdeep"],
["drawclimber","drawclimber"],
["drivewild","drivienwild"],
["emulator","emulator"],

["fireboywatergirl","fireboywatergirl"],
["fireboywatergirl3","fireboywatergirl3"],
["flappybirdmulti","flappybirdmulti"],
["flappydunk","flappydunk"],
["fnaf1","fnaf1"],
["fnaf2","fnaf2"],
["fnaf3","fnaf3"],
["fnaf4","fnaf4"],
["fnf","fnf"],
["forknsausage","forknsausage"],
["geometrydash","geometrydash"],
["gladihoppers","gladihoppers"],
["gobble","gobble"],
["gunspin","gunspin"],
["highwayracer","highwayracer"],
["hook","hook"],
["icedodo","icedodo"],
["jetpackjoyride","jetpackjoyride"],
["magictiles","magictiles"],
["mobcontrol","mobcontrol"],
["monstertracks","monstertracks"],
["motox3m2","motox3m2"],
["motox3m3","motox3m3"],
["motox3m6","motox3m6"],
["osu","osu"],
["ovo","ovo"],
["ovo2","ovo2"],
["ovod","ovod"],
["pou","pou"],
["ragdollhit","ragdollhit"],
["retrobowl","retrobowl"],
["retrobowlc","retrobowlc"],
["roadoffury","roadoffury"],
["sprunki","sprunki"],
["td2","td2"],
["td4","td4"],
["templerun","templerun"],
["watersort","watersort"],
["wave","wave"],
["wordle","wordle"]

]


/* BUILD GRID */

const container=document.getElementById("games")

games.forEach(g=>{

const card=document.createElement("div")
card.className="game"

card.innerHTML=`
<img src="./assets/${g[0]}.png">
<a href="https://native.beer/work/${g[1]}">${g[0]}</a>
`

container.appendChild(card)

})


/* SEARCH */

const search=document.getElementById("search")
const count=document.getElementById("count")

function updateCount(){
let visible=0
document.querySelectorAll(".game").forEach(g=>{
if(g.style.display!="none") visible++
})
count.innerText=visible+" games"
}

search.onkeyup=()=>{
let v=search.value.toLowerCase()

document.querySelectorAll(".game").forEach(g=>{
let name=g.innerText.toLowerCase()

if(name.includes(v)){
g.style.display="block"
}else{
g.style.display="none"
}
})

updateCount()
}

updateCount()



/* DISCLAIMER ALWAYS REQUIRED */

const overlay=document.getElementById("overlay")
const agree=document.getElementById("agree")
const enter=document.getElementById("enter")

// Always show overlay on load
overlay.style.display="flex"

// Enable enter button only when checked
agree.onchange=()=>{
    enter.disabled=!agree.checked
}

enter.onclick=()=>{
    overlay.style.display="none"
    agree.checked = false // reset checkbox for next visit
    enter.disabled = true
}


/* THEME */

const body=document.body
const btn=document.getElementById("themeBtn")

if(localStorage.getItem("theme")){
body.className=localStorage.getItem("theme")
}

btn.onclick=()=>{

if(body.classList.contains("dark")){
body.classList.remove("dark")
body.classList.add("light")
btn.innerText="🌙 Dark Mode"
localStorage.setItem("theme","light")
}else{
body.classList.remove("light")
body.classList.add("dark")
btn.innerText="☀ Light Mode"
localStorage.setItem("theme","dark")
}

}



</script>

</body>

</html>
